        {/* ================= PAGE 2: SCHEDULE / HORARIO ================= */}

            {/* FILTER BUTTONS */}
            <div className="flex flex-wrap justify-center gap-2">

                { id: 'all', label: t.filterAll },
                { id: 'morning', label: t.filterMorning },

                <button
                  key={cat.id}
                  onClick={() => setActiveCategory(cat.id)}
                  className={`px-4 py-2 rounded-full text-xs font-bold transition-all ${

                  </div>

                  <h3 className="text-2xl font-bold text-slate-800">{t.tourSuccessTitle}</h3>
                  <p className="text-sm text-slate-600">{t.tourSuccessMsg}</p>
                  <button
                    onClick={() => setTourSubmitted(false)}
                    className="mt-4 bg-pink-600 text-white px-6 py-2.5 rounded-xl text-xs font-bold shadow-sm hover:bg-pink-700 transition-colors"
                  >
                    Send Another Request
                  </button>
                </div>
              ) : (
                <form 
                  onSubmit={(e) => {
                    e.preventDefault();
                    setTourSubmitted(true);
                  }}
                  className="space-y-4"
                >
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">{t.nameLabel}</label>
                    <input
                      type="text"
                      required
                      value={tourForm.name}
                      onChange={(e) => setTourForm({...tourForm, name: e.target.value})}
                      className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-pink-500"
                      placeholder="e.g. Maria Rodriguez"

                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">{t.emailLabel}</label>
                      <input
                        type="email"
                        required
                        value={tourForm.email}
                        onChange={(e) => setTourForm({...tourForm, email: e.target.value})}
                        className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-pink-500"
                        placeholder="maria@example.com"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">{t.phoneLabel}</label>
                      <input
                        type="tel"
                        required
                        value={tourForm.phone}
                        onChange={(e) => setTourForm({...tourForm, phone: e.target.value})}
                        className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-pink-500"
                        placeholder="(203) 555-0199"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">{t.dateLabel}</label>
                    <input
                      type="date"
                      required
                      value={tourForm.date}
                      onChange={(e) => setTourForm({...tourForm, date: e.target.value})}
                      className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-pink-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">{t.notesLabel}</label>
                    <textarea
                      rows={3}
                      value={tourForm.notes}
                      onChange={(e) => setTourForm({...tourForm, notes: e.target.value})}
                      className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-pink-500"
                      placeholder="Tell us your child's age and preferred visit time..."
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white py-3.5 rounded-2xl font-bold text-sm shadow-md hover:opacity-95 transition-opacity"
                  >
                    {t.submitTour}
                  </button>
                </form>
              )}
            </div>

            {/* DIRECT CONTACT CARD */}
            <div className="bg-purple-50 border border-purple-200 p-6 rounded-3xl flex flex-col md:flex-row items-center justify-between gap-4">
              <div>
                <h4 className="font-bold text-slate-800 text-sm">Need immediate assistance?</h4>
                <p className="text-xs text-slate-600">Call Ms. Rosa directly or send an email anytime.</p>
              </div>
              <div className="flex gap-2">
                <a href="tel:2034001232" className="bg-pink-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm">
                  📞 203-400-1232
                </a>
                <a href="mailto:BrightBlessingshdc@gmail.com" className="bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm">
                  ✉️ Email
                </a>
              </div>
            </div>
          </div>

      </main>

          </div>

          <div className="space-y-2">
            <h4 className="text-white font-bold text-sm">Quick Links</h4>
            <div className="flex flex-col gap-1 text-xs">
              <button onClick={() => setCurrentPage('schedule')} className="hover:text-pink-400">Daily Schedule / Horario</button>
              <button onClick={() => setCurrentPage('spaces')} className="hover:text-pink-400">Our Home & Spaces</button>
              <button onClick={() => setCurrentPage('programs')} className="hover:text-pink-400">Programs & Tuition</button>
              <button onClick={() => setCurrentPage('tour')} className="hover:text-pink-400">Book a Tour</button>
            </div>

          <div className="space-y-2">
            <h4 className="text-white font-bold text-sm">Hours & Subsidies</h4>

}
