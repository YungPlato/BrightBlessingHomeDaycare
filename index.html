/* Puffy rainbow: soft clay surfaces, tactile controls and gentle motion. */
:root{--spring:cubic-bezier(.22,1.35,.45,1);--shadow:0 2px 0 #fff inset,0 9px 0 #d7e4f1,0 19px 32px #3b68931a}
.sky-playground{background:radial-gradient(ellipse at 14% 8%,#fff0c9a0,transparent 36%),radial-gradient(ellipse at 90% 30%,#ecddff90,transparent 32%),linear-gradient(165deg,#fbfdff,#f0f8ff 55%,#fff8f5)}

.cloud{box-shadow:inset 0 4px 8px #fff,0 9px 0 #ddeaf66b,0 15px 24px #7ba2c319}.bubble{box-shadow:inset 3px 5px 8px #fff, inset -3px -4px 6px #c8dff333,0 5px 12px #adc8e516;border-color:#c1d9f08c}
header{box-shadow:0 5px 0 #dbe8f282,0 13px 28px #344f7d0b!important}

header nav button[aria-current=page]{background:linear-gradient(145deg,#fff,#e5f1ff);border:1px solid #d8e5f4;box-shadow:inset 0 2px 0 #fff,0 4px 0 #bfd5eb,0 7px 12px #5b7fa017}
header nav button:not([aria-current]):hover{background:#fff;box-shadow:0 4px 0 #deebf6}
.brand-mark{filter:drop-shadow(0 4px 0 #9fc0df30);transition:transform .35s var(--spring)}header button:hover .brand-mark{transform:rotate(-7deg) scale(1.07)}
.eyebrow{background:linear-gradient(150deg,#fff,#e7f2ff);box-shadow:inset 0 2px 0 #fff,0 4px 0 #d9e6f4,0 8px 14px #39689b08;border:1px solid #d3e4f4}
.hero-garden{gap:3rem;padding-top:3rem;padding-bottom:3.5rem}.hero-garden h1{font-weight:600;text-shadow:0 3px 0 #fff,0 6px 0 #ccdced50}.hero-garden h1 em{color:#b64273;text-shadow:0 3px 0 #fff,0 6px 0 #eec9dc88}.hero-garden h1 em:after{height:10px;background:linear-gradient(90deg,#f4b46e,#f3d14d,#a9cf81,#82bee0,#c2a0d5);z-index:-1}
.clay-primary,.clay-secondary,.contact-action,button[class*="bg-pink-600"],button[class*="from-pink-500"],a[class*="bg-pink-600"]{position:relative;isolation:isolate;transition:transform .28s var(--spring),box-shadow .28s,filter .25s!important}
.clay-primary{background:linear-gradient(145deg,#dc6e9d,#c74b7d 65%,#b94472);border:1px solid #b3456c;box-shadow:inset 0 3px 2px #ffffff70,inset 0 -3px 3px #a4385e30,0 7px 0 #963451,0 13px 18px #ba507c30;border-radius:20px;min-height:54px}
.clay-secondary{background:linear-gradient(145deg,#fff,#edf4fd);border:1px solid #cbdced;box-shadow:inset 0 3px 1px #fff,0 6px 0 #bdcfe2,0 12px 18px #799dc51c;border-radius:20px;min-height:54px}
